name: Field Lab
url: https://jhu-field-lab.github.io

exclude: [bibble, README.md, Makefile, screenshot.png]

# colorize code snippets with the pygments module
highlighter: pygments

# The path structure for blog posts.
permalink: /blog/:year/:month/:day/:title.html

# Sections on the "people" page.
roles:
  - key: faculty
    name: Faculty
  - key: grad
    name: Graduate Students
  - key: master
    name: Master Students
  - key: postdoc
    name: Postdocs
  - key: alum
    name: Alumni
  - key: collab
    name: Collaborators

# Number of news stories on the front page.
front_page_news: 3

# Base pathname for links.
base: ''

# make pages for the _projects folder
collections:
  projects:
    output: true

# Navigation bar links.
navigation:
  - title: Home
    link: /
  - title: People
    link: /#people
  #- title: Research
  #  link: /research.html
  - title: Publications
    link: /publications.html
  - title: GitHub 
    link: https://github.com/JHU-Field-Lab

# Plugins
plugins:
  - jekyll-scholar

# Scholar settings
scholar:
  style: ieee
  locale: en
  source: ./bib
  bibliography: pubs.bib
  bibliography_template: bibentry
  sort_by: year,month
  order: descending
  details_link: Details
